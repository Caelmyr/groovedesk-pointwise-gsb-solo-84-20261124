name: solo87-groovedesk
services:
  desk:
    build:
      context: .
      args:
        GROOVEDESK_RUNTIME_IMAGE: ${GROOVEDESK_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${GROOVEDESK_IMAGE:-solo87-groovedesk:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${GROOVEDESK_PORT:-19887}:8000"
    volumes:
      - disk-library:/var/lib/groovedesk
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/groove/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  disk-library:
